{% extends "base.html" %}
{% block conteudo %}
<div class="chat-layout"><aside class="panel chat-history"><button class="btn btn-primary w-100 mb-4" id="novaConversa"><i class="bi bi-plus-lg me-1"></i>Nova conversa</button><h2 class="section-title">Perguntas sugeridas</h2><div class="d-flex flex-column gap-2 mt-3"><button class="prompt-chip text-start">Resuma o desempenho da operação</button><button class="prompt-chip text-start">Qual departamento possui mais atrasos?</button><button class="prompt-chip text-start">Crie um plano de ação</button><button class="prompt-chip text-start">Quais indicadores precisam de atenção?</button></div><hr><div class="small text-secondary"><i class="bi bi-shield-check me-1"></i>A IA responde com base nos dados autorizados.</div></aside><section class="panel chat-panel"><div class="chat-messages" id="chatMessages"><div class="message ai"><div class="message-avatar"><i class="bi bi-robot"></i></div><div><div class="message-bubble">Olá! Posso analisar os indicadores do MySQL e criar planos de ação.</div><div class="small text-secondary mt-1">Assistente IA</div></div></div></div><div class="chat-composer"><textarea id="pergunta" class="form-control" rows="3" placeholder="Pergunte algo sobre os dados..."></textarea><div class="d-flex justify-content-between align-items-center mt-2"><small class="text-secondary">Ctrl + Enter para enviar</small><div class="d-flex gap-2"><button id="exportar" class="btn btn-outline-secondary" disabled><i class="bi bi-journal-arrow-up"></i> Obsidian</button><button id="enviar" class="btn btn-primary"><i class="bi bi-send-fill me-1"></i>Enviar</button></div></div></div></section></div>
{% endblock %}
{% block scripts %}<script src="/static/js/assistente.js"></script>{% endblock %}
